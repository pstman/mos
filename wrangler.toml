# :schema node_modules/wrangler/config-schema.json
name = "mostafa-shiri-official"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets built by Vite (npm run build -> ./dist)
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare Workers KV Namespace binding for Mostafa Shiri Official Website
[[kv_namespaces]]
binding = "SHIRI_KV"
id = "ba597afb355c4abcbe22f7692c9bd802"
preview_id = "ba597afb355c4abcbe22f7692c9bd802"

# Environment variables
[vars]
# Optional custom admin password can be set via:
# npx wrangler secret put ADMIN_PASSWORD
